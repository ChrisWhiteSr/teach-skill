[project]
name = "teach-onboard"
version = "0.2.0"
description = "Browser onboarding for the teach skill: set a mission, shape a skill map, run an adaptive placement, and save a course any agent can teach from."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
  "anthropic>=1.13",
  "pyyaml>=6",
]

[project.optional-dependencies]
bedrock = ["anthropic[bedrock]>=1.13"]

[project.scripts]
teach-onboard = "teach_onboard.__main__:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/teach_onboard"]

[tool.hatch.build.targets.wheel.force-include]
"skill" = "teach_onboard/skill"
"packs" = "teach_onboard/packs"

[tool.pytest.ini_options]
testpaths = ["tests"]
